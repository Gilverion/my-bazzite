---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: my-bazzite
# description will be included in the image's metadata
description: custom Bazzite image without Waydroid and preinstalled Discord

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bazzite-nvidia
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: dnf
    repos:
      copr:
        - atim/starship
        - codifryed/CoolerControl
    install:
      packages:
        - micro
        - starship
        - coolercontrol
        - ckb-next
        
  - type: systemd
    system:
      enabled:
        - coolercontrold.service
        - ckb-next-daemon.service     
        
  - type: rpm-ostree
    remove:
      - waydroid
      - waydroid-selinux
      
  - type: script
    scripts:
      - install-official-discord.sh
      - remove-waydroid-remnants.sh
      
  - type: signing
